        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "BILLING_PLAN_MISSING", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/policies/{id}/payments:
    post:
      summary: Tahsilat (ACCOUNTING veya kendi poliçesine CUSTOMER)
      description: |
        Poliçe kilidi → ödeme tarihine kadar faiz → en eski taksitin faizi, sonra anapara → tahsis ve yevmiye/audit.
        Tüm bakiyeyi aşan ödeme bütünüyle 422 OVERPAYMENT. İptal edilmiş poliçenin açık bakiyesi ödenebilir.
        CUSTOMER için tarih bugün; ACCOUNTING payment_date <= bugün ve >= son tahakkuk to.
        Aynı anahtarda işlem sürerken 409, tamamlandıktan sonra aynı yanıt ve Idempotent-Replayed başlığı.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PaymentRequest' } }
      responses:
        '201':
          description: Ödeme ve aynı transaction içindeki yevmiye
          content:
            application/json: { schema: { $ref: '#/components/schemas/Payment' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "BILLING_PLAN_MISSING, IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_CONFLICT veya CONCURRENT_PAYMENT (CHECK ikinci savunması)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: "OVERPAYMENT, PAYMENT_DATE_IN_FUTURE, PAYMENT_DATE_BEFORE_POLICY, PAYMENT_DATE_BEFORE_ACCRUAL veya IDEMPOTENCY_KEY_REUSED", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/payments/{id}/refund:
    post:
      summary: Tahsilat iadesi (ACCOUNTING, yalnızca ACTIVE poliçe)
      description: |
        Poliçe kilidi altında, tutar <= ödemenin kalan iade edilebilir tutarı.
        Önce bugüne faiz; sonra özgün tahsisleri en sondan geriye geri alır.
        REFUND ve pozitif tahsisler, ters yevmiye, audit. Geri açılan anapara sonraki tahakkukta faizlenir.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_kurus, reason]
              properties:
                amount_kurus: { type: integer, format: int64, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: REFUND ödemesi
          content:
            application/json: { schema: { $ref: '#/components/schemas/Payment' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "REFUND_REQUIRES_ACTIVE_POLICY, REFUND_ALLOCATION_MISSING, CONCURRENT_PAYMENT veya IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_CONFLICT", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: "REFUND_EXCEEDS_PAYMENT veya IDEMPOTENCY_KEY_REUSED", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/billing/run:
    post:
      summary: Faiz tahakkuku ve 30 gün kuralı (ACCOUNTING)
      description: |
        Her poliçe ayrı transaction; poliçe FOR UPDATE SKIP LOCKED, kilitli kayıt skipped/LOCKED.
        Açık anapara için basit faiz, sonra >=30 gün gecikmiş ACTIVE poliçeye mevcut iptal servisi NON_PAYMENT/as_of.
        CLAIMS_AFTER_EFFECTIVE_DATE ve uygun olmayan etki tarihi atlanır/raporlanır. Aynı as_of yeni faiz/iptal üretmez.
        Zamanlayıcı yok. İptal edilmiş poliçede faiz cancel_effective_date ile kırpılır.
        Yalnız as_of öncesi açık vadesi veya açık faizi olan aktif planlar adaydır.
        Varsayılan 500, en çok 2000 poliçe; gerçek saatle ~8 saniye sonra yeni poliçeye başlanmaz.
        done=false ise next_after_policy_id ile devam edilir. İmleç kilitli ve başarısız poliçeleri de geçer.
        Poliçe hataları failed listesinde; bağlantı/context hataları koşuyu durdurur.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                as_of: { type: string, format: date, description: Varsayılan bugün; gelecekte olamaz }
                after_policy_id: { type: integer, format: int64, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        '200':
          description: İşlenen ve atlanan poliçeler
          content:
            application/json: { schema: { $ref: '#/components/schemas/BillingRun' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: "AS_OF_IN_FUTURE", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/ledger/trial-balance:
    get:
      summary: Hesap bazında mizan ve 1200 mutabakatı (ACCOUNTING)
      description: Repeatable-read snapshot; 1200 borç-alacak = açık taksit anaparası + ödenmemiş faiz. Satırsız/dengesiz yevmiye sayısı 0 olmalı.
      security: [{ bearerAuth: [] }]
      responses:
