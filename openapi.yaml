        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/claim-tasks:
    get:
      summary: Görevler (CLAIMS_ADJUSTER tümü, APPRAISER yalnız kendi ataması)
      description: Fraud kuyruğu task_type=FRAUD_REVIEW ve status=open filtresidir. SLA takvim saatiyle hesaplanır; tam vade anı ihlal değildir.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string, enum: [open, done, all], default: open } }
        - { name: task_type, in: query, schema: { type: string, enum: [APPRAISAL, ADJUSTMENT, FRAUD_REVIEW] } }
        - { name: breached, in: query, schema: { type: boolean, default: false } }
        - { name: claim_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: assigned_to, in: query, schema: { type: string, enum: [me] } }
      responses:
        '200':
          description: Keyset görev sayfası
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClaimTask' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/claim-tasks/workload:
    get:
      summary: Aktif eksper ve hasar uzmanlarının açık görev sayıları (CLAIMS_ADJUSTER)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Havuzlar rol alanıyla aynı listede; açık görev sayısı tüm tipleri kapsar
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskWorkload' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/claim-tasks/sla-summary:
    get:
      summary: Görev tipi başına SLA özeti (CLAIMS_ADJUSTER)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Üç görev tipi; done/on_time_bp yalnız DONE, CANCELLED paydaya girmez
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskSLASummary' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports/production:
    get:
      summary: Yazılan net prim ve tahakkuk eden tazminat (ACCOUNTING, UNDERWRITER)
      description: Yevmiye entry_date döneminde [from,to). Eksik sınır açıktır. 4000 net alacak ve 5000 net borç; kazanılmış prim, muallak ve IBNR yoktur. Acentesiz poliçeler ayrı gruptur.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { type: string, enum: [month, product, agent], default: month } }
      responses:
        '200':
          description: Boyut satırları ve aynı tutarlardan hesaplanan genel toplam
          content:
            application/json:
              schema:
                type: object
                required: [group_by, items, total]
                properties:
                  group_by: { type: string, enum: [month, product, agent] }
                  items: { type: array, items: { $ref: '#/components/schemas/ProductionRow' } }
                  total: { $ref: '#/components/schemas/ProductionRow' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: INVALID_PERIOD — biçim hatası veya from ≥ to
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Cursor: { name: cursor, in: query, description: Önceki sayfanın opak next_cursor değeri, schema: { type: string } }
    ID: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: gp_refresh }

  responses:
    ValidationError:
      description: VALIDATION_ERROR (alan hataları details içinde)
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    Unauthenticated:
      description: UNAUTHENTICATED
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    Forbidden:
      description: FORBIDDEN
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    NotFound:
      description: NOT_FOUND (yok veya kapsam dışı)
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }

  schemas:
    SystemActivity:
      type: object
      required: [db_ok, last_event_at, minutes, simulation]
      properties:
        db_ok: { type: boolean }
        last_event_at: { type: string, nullable: true, format: date-time }
        minutes:
          type: array
          maxItems: 30
          items:
            type: object
            required: [at, count]
            properties:
              at: { type: string, format: date-time }
              count: { type: integer, format: int64 }
        simulation:
          type: object
          nullable: true
          properties:
            status: { type: string, enum: [RUNNING, COMPLETED, FAILED, LIVE] }
            phase: { type: string }
            done: { type: integer, format: int64 }
            target: { type: integer, format: int64 }
            seed: { type: integer, format: int64 }
            fingerprint: { type: string, nullable: true }
            started_at: { type: string, format: date-time }
            finished_at: { type: string, nullable: true, format: date-time }
            summary: { type: object, additionalProperties: true }
    Role:
      type: string
      enum: [CUSTOMER, AGENT, UNDERWRITER, APPRAISER, CLAIMS_ADJUSTER, ACCOUNTING]
    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        db: { type: string, enum: [ok, down] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: INVALID_CREDENTIALS }
            message: { type: string }
            details: { type: object, additionalProperties: { type: string } }
    User:
      type: object
      required: [id, email, full_name, role]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Session:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: saniye }
        user: { $ref: "#/components/schemas/User" }
    Customer:
      type: object
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        national_id_masked: { type: string, example: "*******0001" }
        birth_date: { type: string, format: date }
        region_code: { type: string }
        agent_id: { type: integer, format: int64, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
    Product: { type: string, enum: [KASKO, TRAFIK, KONUT] }
    QuoteStatus: { type: string, enum: [CALCULATED, UW_REVIEW, APPROVED, REJECTED, CONVERTED, EXPIRED] }
    Coverage:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        required: { type: boolean }
        limit_kurus: { type: integer, format: int64 }
        event_limit_kurus: { type: integer, format: int64, minimum: 1, nullable: true, description: Olay başına limit; null ise yok. }
        deductible_type: { type: string, enum: [NONE, FIXED, PERCENT_BP] }
        deductible_value: { type: integer, format: int64 }
        base_premium_kurus: { type: integer, format: int64 }
        premium_kurus: { type: integer, format: int64 }
    Tariff:
      type: object
      properties:
        id: { type: integer, format: int64 }
        product: { $ref: "#/components/schemas/Product" }
        version_no: { type: integer }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date, nullable: true }
        factor_order: { type: array, items: { type: string } }
        factors:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [AGE, NCD, REGION, VEHICLE_GROUP] }
              key: { type: string }
              range: { type: object, properties: { lo: { type: integer }, hi: { type: integer, nullable: true } } }
              multiplier_bp: { type: integer }
        coverages: { type: array, items: { $ref: "#/components/schemas/Coverage" } }
        annual_limit_kurus: { type: integer, format: int64 }
        short_period_rates:
          type: array
          items: { type: object, properties: { from_day: { type: integer }, to_day: { type: integer }, rate_bp: { type: integer } } }
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [customer_id, product, term_start, coverages]
      properties:
        customer_id: { type: integer, format: int64 }
        product: { $ref: "#/components/schemas/Product" }
        term_start: { type: string, format: date }
        ncd_level: { type: integer, description: Tarifede tanımlı kademe }
        vehicle_group: { type: string, description: KASKO/TRAFIK için zorunlu }
        plate: { type: string, description: KASKO/TRAFIK için zorunlu; boşluklar silinir, büyük harfe çevrilir }
        coverages: { type: array, items: { type: string }, description: Zorunlu teminatlar dahil olmalı }
    PremiumLine:
      type: object
      properties:
        seq: { type: integer }
        coverage_code: { type: string }
        line_type: { type: string, enum: [BASE, FACTOR, ROUNDING] }
        factor_type: { type: string }
        factor_label: { type: string }
        multiplier_bp: { type: integer }
        amount_kurus: { type: integer, format: int64, description: Bu adımın TL etkisi (kuruş, işaretli) }
    Calculation:
      type: object
      properties:
        customer_id: { type: integer, format: int64 }
        product: { $ref: "#/components/schemas/Product" }
        tariff: { type: object, properties: { id: { type: integer }, version_no: { type: integer }, valid_from: { type: string, format: date } } }
        term_start: { type: string, format: date }
        term_end: { type: string, format: date }
        risk: { type: object }
        selection: { type: object, properties: { coverages: { type: array, items: { $ref: "#/components/schemas/Coverage" } }, annual_limit_kurus: { type: integer } } }
        lines: { type: array, items: { $ref: "#/components/schemas/PremiumLine" } }
        total_premium_kurus: { type: integer, format: int64 }
        input_hash: { type: string, description: Fiyat girdisi + tarife sürümünün SHA-256'sı }
        review_required: { type: boolean }
        review_reasons: { type: array, items: { type: string, enum: [YOUNG_DRIVER, HIGH_PREMIUM] } }
    Quote:
      type: object
      properties:
        id: { type: integer, format: int64 }
        customer_id: { type: integer, format: int64 }
        customer_name: { type: string }
        agent_id: { type: integer, format: int64, nullable: true }
        product: { $ref: "#/components/schemas/Product" }
        tariff: { type: object }
        term_start: { type: string, format: date }
        term_end: { type: string, format: date }
        risk: { type: object }
        selection: { type: object }
        input_hash: { type: string }
        total_premium_kurus: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/QuoteStatus" }
        underwriter_note: { type: string, nullable: true }
        valid_until: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        policy_id: { type: integer, format: int64, nullable: true }
        lines: { type: array, items: { $ref: "#/components/schemas/PremiumLine" } }
    IssuedPolicy:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policy_no: { type: string, example: GP-KS-2026-00000011 }
        product: { $ref: "#/components/schemas/Product" }
        quote_id: { type: integer, format: int64 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: string }
        version_no: { type: integer }
        annual_premium_kurus: { type: integer, format: int64 }
        annual_limit_kurus: { type: integer, format: int64 }
        vehicle_plate: { type: string, nullable: true }
        coverages: { type: array, items: { $ref: "#/components/schemas/Coverage" } }
        limit_balances:
          type: array
          items:
            type: object
            properties:
              coverage_code: { type: string, nullable: true, description: null = yıllık toplam limit }
              period_start: { type: string, format: date }
              period_end: { type: string, format: date }
              limit_kurus: { type: integer, format: int64 }
              used_kurus: { type: integer, format: int64 }
    PolicyItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policy_no: { type: string }
        product: { $ref: "#/components/schemas/Product" }
        customer_id: { type: integer, format: int64 }
        customer_name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: string }
        annual_premium_kurus: { type: integer, format: int64 }
        vehicle_plate: { type: string, nullable: true }
    PolicyVersion:
      type: object
      properties:
        id: { type: integer, format: int64 }
        version_no: { type: integer }
        effective_from: { type: string, format: date }
        effective_to: { type: string, format: date, nullable: true, description: "null = açık (son sürüm); bitiş poliçeden gelir" }
        tariff_version_id: { type: integer, format: int64 }
        tariff_version_no: { type: integer }
        vehicle_plate: { type: string, nullable: true }
        risk: { type: object }
        annual_premium_kurus: { type: integer, format: int64 }
        annual_limit_kurus: { type: integer, format: int64, nullable: true }
        recorded_at: { type: string, format: date-time }
        endorsement_no: { type: integer, nullable: true, description: Bu sürümü açan zeyil (ilk sürümde null) }
        coverages: { type: array, items: { $ref: "#/components/schemas/Coverage" } }
    CalcDetail:
      type: object
      description: Adım adım hesap kaydı (endorsements.calc_detail)
      properties:
        cash_refund_kurus: { type: integer, format: int64, description: Müşteriye nakit iade }
        kind: { type: string, enum: [VEHICLE_CHANGE, CANCELLATION] }
        method: { type: string, enum: [PRO_RATA, SHORT_PERIOD] }
        reason: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        period_days: { type: integer }
        leap_day_in_period: { type: boolean }
        effective_date: { type: string, format: date }
        elapsed_days: { type: integer }
        remaining_days: { type: integer }
        old_annual_premium_kurus: { type: integer, format: int64 }
        new_annual_premium_kurus: { type: integer, format: int64 }
        annual_difference_kurus: { type: integer, format: int64 }
        annual_premium_kurus: { type: integer, format: int64 }
        written_premium_kurus: { type: integer, format: int64 }
        short_period_band: { type: object, properties: { from_day: { type: integer }, to_day: { type: integer, nullable: true }, rate_bp: { type: integer } } }
        earned_premium_kurus: { type: integer, format: int64 }
        refund_kurus: { type: integer, format: int64 }
        numerator: { type: integer, format: int64 }
        denominator: { type: integer, format: int64 }
        unrounded_kurus: { type: string, example: "199670.0712" }
        rounded_kurus: { type: integer, format: int64 }
        rounding: { type: string, enum: [HALF_AWAY_FROM_ZERO] }
        premium_delta_kurus: { type: integer, format: int64, description: "+ ek prim, − iade" }
        steps: { type: array, items: { type: string } }
        tariff_version_id: { type: integer, format: int64 }
        from_version_no: { type: integer }
        to_version_no: { type: integer }
        version_closed: { type: boolean }
        note: { type: string }
    Endorsement:
      type: object
      properties:
        id: { type: integer, format: int64 }
        endorsement_no: { type: integer }
        type: { type: string, enum: [VEHICLE_CHANGE, CANCELLATION] }
        effective_date: { type: string, format: date }
        from_version_id: { type: integer, format: int64 }
        to_version_id: { type: integer, format: int64, nullable: true }
        premium_delta_kurus: { type: integer, format: int64 }
        calc_detail: { $ref: "#/components/schemas/CalcDetail" }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    PolicyDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policy_no: { type: string }
        product: { $ref: "#/components/schemas/Product" }
        customer_id: { type: integer, format: int64 }
        customer_name: { type: string }
        agent_id: { type: integer, format: int64, nullable: true }
        quote_id: { type: integer, format: int64, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        period_days: { type: integer }
        status: { type: string, enum: [ACTIVE, CANCELLED, EXPIRED] }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancel_effective_date: { type: string, format: date, nullable: true }
        cancel_reason: { type: string, nullable: true }
        premium:
          type: object
          properties:
            initial_premium_kurus: { type: integer, format: int64 }
            endorsement_deltas_kurus: { type: integer, format: int64 }
            written_premium_kurus: { type: integer, format: int64 }
            cancellation_refund_kurus: { type: integer, format: int64 }
            net_premium_kurus: { type: integer, format: int64 }
        versions: { type: array, items: { $ref: "#/components/schemas/PolicyVersion" } }
        endorsements: { type: array, items: { $ref: "#/components/schemas/Endorsement" } }
        limit_balances: { type: array, items: { type: object } }
    VehicleChangeRequest:
      type: object
      additionalProperties: false
      required: [effective_date]
      properties:
        effective_date: { type: string, format: date }
        vehicle_group: { type: string, description: Boşsa değişmez }
        plate: { type: string, description: Boşsa değişmez }
        coverage_limits: { type: object, additionalProperties: { type: integer, format: int64 }, description: "teminat → yeni limit (kuruş); 1 ≤ limit ≤ katalog limiti; kullanılanın altına düşemez" }
        base_version_no: { type: integer, description: "Önizlenen açık sürüm; değiştiyse 409 STALE_VERSION" }
    VehicleChangePreview:
      type: object
      properties:
        cash_refund_kurus: { type: integer, format: int64, description: Prim azalışından farklı olarak müşteriye nakit iade }
        policy_id: { type: integer, format: int64 }
        type: { type: string, enum: [VEHICLE_CHANGE] }
        effective_date: { type: string, format: date }
        base_version_no: { type: integer }
        new_version_no: { type: integer }
        old_annual_premium_kurus: { type: integer, format: int64 }
        new_annual_premium_kurus: { type: integer, format: int64 }
        premium_delta_kurus: { type: integer, format: int64 }
        vehicle_plate: { type: string }
        vehicle_group: { type: string }
        coverages: { type: array, items: { $ref: "#/components/schemas/Coverage" } }
        lines: { type: array, items: { $ref: "#/components/schemas/PremiumLine" } }
        calc_detail: { $ref: "#/components/schemas/CalcDetail" }
    CancelRequest:
      type: object
      additionalProperties: false
      required: [effective_date, reason]
      properties:
        effective_date: { type: string, format: date }
        reason: { type: string, enum: [CUSTOMER_REQUEST, UNDERWRITER, NON_PAYMENT, OTHER] }
        note: { type: string, maxLength: 1000 }
        base_version_no: { type: integer }
    CancelPreview:
      type: object
      properties:
        cash_refund_kurus: { type: integer, format: int64 }
        policy_id: { type: integer, format: int64 }
        effective_date: { type: string, format: date }
        reason: { type: string }
        method: { type: string, enum: [PRO_RATA, SHORT_PERIOD] }
        base_version_no: { type: integer }
        written_premium_kurus: { type: integer, format: int64 }
        refund_kurus: { type: integer, format: int64 }
        premium_delta_kurus: { type: integer, format: int64 }
        closes_version: { type: boolean }
        calc_detail: { $ref: "#/components/schemas/CalcDetail" }

    Claim:
      type: object
      required:
      - id
      - policy_id
      - policy_version_id
      - created_by
      - customer_id
      - row_version
      - claim_no
      - policy_no
      - coverage_code
      - description
      - loss_date
      - reported_at
      - plate
      - workshop_id
      - agent_id
      - claimed_amount_kurus
      - status
      properties:
        id:
          type: integer
          format: int64
        policy_id:
          type: integer
          format: int64
        policy_version_id:
          type: integer
          format: int64
        created_by:
          type: integer
          format: int64
        customer_id:
          type: integer
          format: int64
        row_version:
          type: integer
          format: int64
        claim_no:
          type: string
        policy_no:
          type: string
        coverage_code:
          type: string
        description:
          type: string
        loss_date:
          type: string
          format: date
        reported_at:
          type: string
          format: date-time
        plate:
          type: string
          nullable: true
        workshop_id:
          type: integer
          format: int64
          nullable: true
        agent_id:
          type: integer
          format: int64
          nullable: true
        claimed_amount_kurus:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum:
          - REPORTED
          - TRIAGED
          - APPRAISAL
          - ADJUSTMENT
          - FRAUD_REVIEW
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
          - PAID
          - CLOSED
    ClaimDetail:
      allOf:
      - "$ref": "#/components/schemas/Claim"
      - type: object
        required:
        - history
        - appraisals
        - settlement
        description: CLAIMS_ADJUSTER fraud/tasks/allowed_transitions; APPRAISER kendi tasks alanını görür. CUSTOMER/AGENT iç inceleme alanı almaz; durum/geçmiş FRAUD_REVIEW yerine UNDER_REVIEW döner. Sistem, incelemeye giriş ve temize çıkış notları gizlenir; REJECTED gerekçesi müşteriye gösterilir. Boş opsiyonel diziler atlanabilir.
        properties:
          fraud: { $ref: '#/components/schemas/FraudResult' }
          tasks: { type: array, items: { $ref: '#/components/schemas/ClaimTask' } }
          allowed_transitions: { type: array, items: { type: string } }
          history:
            type: array
            items:
              "$ref": "#/components/schemas/ClaimHistory"
          appraisals:
            type: array
            items:
              "$ref": "#/components/schemas/Appraisal"
          settlement:
            allOf:
            - "$ref": "#/components/schemas/ClaimSettlement"
            nullable: true
    ClaimHistory:
      type: object
      required: []
      properties:
        id:
          type: integer
          format: int64
        from_status:
          type: string
          enum:
          - REPORTED
          - TRIAGED
          - APPRAISAL
          - ADJUSTMENT
          - FRAUD_REVIEW
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
          - PAID
          - CLOSED
          nullable: true
        to_status:
          type: string
          enum:
          - REPORTED
          - TRIAGED
          - APPRAISAL
          - ADJUSTMENT
          - FRAUD_REVIEW
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
          - PAID
          - CLOSED
        actor_user_id:
          type: integer
          format: int64
          nullable: true
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    ClaimReportRequest:
      type: object
      required:
      - policy_id
      - coverage_code
      - loss_date
      - description
      - claimed_amount_kurus
      properties:
        policy_id:
          type: integer
          format: int64
          minimum: 1
        coverage_code:
          type: string
          minLength: 1
        loss_date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 4000
        claimed_amount_kurus:
          type: integer
          format: int64
          minimum: 0
        workshop_id:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    ClaimTransitionRequest:
      type: object
      required:
      - to_status
      - expected_row_version
      properties:
        to_status:
          type: string
          enum:
          - TRIAGED
          - APPRAISAL
          - ADJUSTMENT
          - FRAUD_REVIEW
          - REJECTED
          - CLOSED
        expected_row_version:
          type: integer
          minimum: 1
        note:
          type: string
          maxLength: 4000
      additionalProperties: false
    AppraisalRequest:
      type: object
      required:
      - damage_amount_kurus
      - inspected_at
      properties:
        damage_amount_kurus:
          type: integer
          format: int64
          minimum: 0
        is_total_loss:
          type: boolean
        notes:
          type: string
          maxLength: 4000
        inspected_at:
          type: string
          format: date-time
      additionalProperties: false
    Appraisal:
      type: object
      required: []
      properties:
        id:
          type: integer
          format: int64
        appraiser_id:
          type: integer
          format: int64
        inspected_at:
          type: string
          format: date-time
        damage_amount_kurus:
          type: integer
          format: int64
          minimum: 0
        is_total_loss:
          type: boolean
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    SettlementStep:
      type: object
      required:
      - code
      - input_kurus
      - output_kurus
      - clipped_kurus
      - description
      - skipped
      properties:
        code:
          type: string
          enum:
          - GROSS_DAMAGE
          - DEDUCTIBLE
          - AFTER_DEDUCTIBLE
          - COVERAGE_LIMIT
          - ANNUAL_LIMIT
          - PAYABLE
        input_kurus:
          type: integer
          format: int64
          minimum: 0
        output_kurus:
          type: integer
          format: int64
          minimum: 0
        clipped_kurus:
          type: integer
          format: int64
          minimum: 0
        description:
          type: string
        skipped:
          type: boolean
    SettlementPreview:
      type: object
      required:
      - gross_damage_kurus
      - deductible_kurus
      - payable_kurus
      - calc_steps
      properties:
        gross_damage_kurus:
          type: integer
          format: int64
          minimum: 0
        deductible_kurus:
          type: integer
          format: int64
          minimum: 0
        payable_kurus:
          type: integer
          format: int64
          minimum: 0
        calc_steps:
          type: array
          items:
            "$ref": "#/components/schemas/SettlementStep"
    ClaimSettlement:
      allOf:
      - "$ref": "#/components/schemas/SettlementPreview"
      - type: object
        required:
        - id
        - claim_id
        - status
        - approved_by
        - approved_at
        - paid_at
        - payment_journal_entry_id
        properties:
          id:
            type: integer
            format: int64
          claim_id:
            type: integer
            format: int64
          status:
            type: string
            enum:
            - APPROVED
            - PAID
          approved_by:
            type: integer
            format: int64
          approved_at:
            type: string
            format: date-time
          paid_at:
            type: string
            format: date-time
            nullable: true
          payment_journal_entry_id:
            type: integer
            format: int64
            nullable: true

    PaymentRequest:
      type: object
      additionalProperties: false
      required: [amount_kurus, method]
      properties:
        amount_kurus: { type: integer, format: int64, minimum: 1 }
        method: { type: string, enum: [CASH, CARD, TRANSFER] }
        payment_date: { type: string, format: date, description: Yalnızca ACCOUNTING; verilmezse bugün }
    Payment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policy_id: { type: integer, format: int64 }
        kind: { type: string, enum: [PAYMENT, REFUND] }
        amount_kurus: { type: integer, format: int64 }
        method: { type: string, enum: [CASH, CARD, TRANSFER] }
        refund_of_payment_id: { type: integer, format: int64, nullable: true }
        paid_at: { type: string, format: date-time }
        journal_entry_id: { type: integer, format: int64 }
        reference: { type: string }
    Installment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        seq: { type: integer }
        due_date: { type: string, format: date }
        amount_kurus: { type: integer, format: int64 }
        paid_kurus: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, PARTIAL, PAID, CANCELLED] }
        overdue_days: { type: integer, format: int64 }
    InterestCharge:
      type: object
      properties:
        id: { type: integer, format: int64 }
        installment_id: { type: integer, format: int64 }
        accrued_from: { type: string, format: date }
        accrued_to: { type: string, format: date, description: Hariç sınır }
        overdue_principal_kurus: { type: integer, format: int64 }
        daily_rate_ppm: { type: integer, format: int64 }
        amount_kurus: { type: integer, format: int64 }
        paid_kurus: { type: integer, format: int64 }
    PaymentAllocation:
      type: object
      description: Tutar pozitif; PAYMENT tahsis eder, REFUND geri alır. İki hedef alanından yalnızca biri dolu.
      properties:
        id: { type: integer, format: int64 }
        payment_id: { type: integer, format: int64 }
        installment_id: { type: integer, format: int64, nullable: true }
        late_interest_charge_id: { type: integer, format: int64, nullable: true }
        amount_kurus: { type: integer, format: int64 }
    BillingPlan:
      type: object
      properties:
        policy_id: { type: integer, format: int64 }
        policy_status: { type: string }
        plan_id: { type: integer, format: int64 }
        total_kurus: { type: integer, format: int64, minimum: 0, description: İptal olmayan taksitlerin toplamı }
        installment_count: { type: integer, description: İlk düzenlemedeki taksit sayısı; ek taksitle değişmez }
        daily_rate_ppm: { type: integer, format: int64 }
        open_balance_kurus: { type: integer, format: int64, description: Açık anapara ve son tahakkuka göre ödenmemiş faiz }
        installments: { type: array, items: { $ref: '#/components/schemas/Installment' } }
        interest: { type: array, items: { $ref: '#/components/schemas/InterestCharge' } }
        allocations: { type: array, items: { $ref: '#/components/schemas/PaymentAllocation' } }
        payments:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/Payment' }
              - type: object
                properties:
                  refundable_kurus: { type: integer, format: int64 }
    BillingRun:
      type: object
      properties:
        next_after_policy_id: { type: integer, format: int64 }
        done: { type: boolean }
        failed:
          type: array
          items:
            type: object
            properties:
              policy_id: { type: integer, format: int64 }
              code: { type: string }
        as_of: { type: string, format: date }
        accrual_count: { type: integer }
        interest_kurus: { type: integer, format: int64 }
        cancelled: { type: array, items: { type: integer, format: int64 } }
        skipped:
          type: array
          items:
            type: object
            properties:
              policy_id: { type: integer, format: int64 }
              reason: { type: string }
    TrialBalance:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              debit_kurus: { type: integer, format: int64 }
              credit_kurus: { type: integer, format: int64 }
              balance_kurus: { type: integer, format: int64 }
        total_debit_kurus: { type: integer, format: int64 }
        total_credit_kurus: { type: integer, format: int64 }
        balanced: { type: boolean }
        empty_entries: { type: integer, format: int64 }
        unbalanced_entries: { type: integer, format: int64 }
        receivable_reconciliation:
          type: object
          properties:
            ledger_1200: { type: integer, format: int64 }
            open_installments: { type: integer, format: int64 }
            open_interest: { type: integer, format: int64 }
            matches: { type: boolean }
    JournalEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        entry_date: { type: string, format: date }
        description: { type: string }
        ref_type: { type: string }
        ref_id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              account_code: { type: string }
              debit_kurus: { type: integer, format: int64 }
              credit_kurus: { type: integer, format: int64 }

    FraudResult:
      type: object
      required: [score, threshold, flagged, signals]
      properties:
        score: { type: integer }
        threshold: { type: integer }
        flagged: { type: boolean }
        signals:
          type: array
          items:
            type: object
            required: [rule_code, points, detail, explanation]
            properties:
              rule_code: { type: string, enum: [EARLY_CLAIM, REPEAT_PLATE, WORKSHOP_CONCENTRATION] }
              points: { type: integer }
              explanation: { type: string }
              detail:
                type: object
                properties:
                  threshold: { type: integer }
                  days: { type: integer, format: int64 }
                  count: { type: integer }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  previous_claim_nos: { type: array, items: { type: string } }
    ClaimTask:
      type: object
      required: [id, claim_id, claim_no, task_type, status, assigned_to, created_at, sla_due_at, completed_at, breached, remaining_seconds]
      properties:
        id: { type: integer, format: int64 }
        claim_id: { type: integer, format: int64 }
        claim_no: { type: string }
        task_type: { type: string, enum: [APPRAISAL, ADJUSTMENT, FRAUD_REVIEW] }
        status: { type: string, enum: [OPEN, IN_PROGRESS, DONE, CANCELLED] }
        assigned_to:
          type: object
          nullable: true
          required: [id, full_name]
          properties:
            id: { type: integer, format: int64 }
            full_name: { type: string }
        created_at: { type: string, format: date-time }
        sla_due_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        breached: { type: boolean }
        remaining_seconds: { type: integer, format: int64, description: Gecikmede negatif; kapalı görevde completed_at anına göre }
        fraud_score: { type: integer, description: Yalnız FRAUD_REVIEW }
        signal_codes: { type: array, items: { type: string }, description: Yalnız FRAUD_REVIEW ve sinyal varsa }
    TaskWorkload:
      type: object
      required: [id, full_name, role, open_tasks]
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        role: { type: string, enum: [APPRAISER, CLAIMS_ADJUSTER] }
        open_tasks: { type: integer, format: int64 }
    TaskSLASummary:
      type: object
      required: [task_type, open, open_breached, done, done_late, on_time_bp]
      properties:
        task_type: { type: string, enum: [APPRAISAL, ADJUSTMENT, FRAUD_REVIEW] }
        open: { type: integer, format: int64 }
        open_breached: { type: integer, format: int64 }
        done: { type: integer, format: int64 }
        done_late: { type: integer, format: int64 }
        on_time_bp: { type: integer, format: int64, nullable: true, description: DONE yoksa null; zamanında DONE / tüm DONE }
    ProductionRow:
      type: object
      required: [key, label, written_premium_kurus, policy_count, incurred_claims_kurus, loss_ratio_bp]
      properties:
        key: { type: string }
        label: { type: string }
        written_premium_kurus: { type: integer, format: int64 }
        policy_count: { type: integer, format: int64 }
        incurred_claims_kurus: { type: integer, format: int64 }
        loss_ratio_bp: { type: integer, format: int64, nullable: true, description: Prim ≤0 veya int64 sonuç taşarsa null; yarımı yukarı baz puan }
