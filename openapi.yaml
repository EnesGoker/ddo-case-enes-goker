  /api/v1/policies/{id}/billing:
    get:
      summary: Ödeme planı, faizler, tahsisler ve ödemeler
      description: CUSTOMER/AGENT kendi, ACCOUNTING/UNDERWRITER tüm poliçeler. Poliçe kilidi altında tutarlı görünüm; plan yoksa 409 BILLING_PLAN_MISSING.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: Son tahakkuka göre açık bakiye ve mali kayıtlar
          content:
