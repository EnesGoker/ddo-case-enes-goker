openapi: 3.0.3
info:
  title: GüvenPoliçe API
  version: 0.7.0
  description: |
    A1–A7 kapsamı: sağlık, metrik, kimlik doğrulama, müşteri listesi, tarife, teklif (F-1/T-1),
    poliçe listesi/detayı, tarihte teminat, araç değişikliği zeyli ve iptal (F-2/T-2), hasar/ekspertiz/tazminat/ödeme (F-4/F-5/F-6/T-3).
    Taksit/tahsilat/iade, basit gecikme faizi, 30 gün iptal ve mizan/mutabakat (F-3/T-4).
    Fraud, görev/atama/SLA (T-5), defterden prim ve hasar/prim raporu (F-7).
    Parçalı gün sonu ve yalnız sayısal sistem canlılığı (A7).
    Para alanları kuruş cinsinden tam sayıdır (`*_kurus`); oranlar bp (10000 = ×1).
    Erişim kuralı: rol uca hiç erişemiyorsa 403; erişebiliyor ama kayıt kapsam dışındaysa 404.
    Listeler keyset sayfalıdır: `?limit=` (1–100) ve önceki yanıttaki opak `next_cursor`.
    Normal Idempotency-Key tekrarı aynı yanıt baytlarını döner; çökme kurtarmasında aynı kaynak ve özgün HTTP durumuyla kanonik yanıt döner.
    Tüm hatalar `{"error":{"code","message","details?"}}` biçimindedir.
    Refresh token yalnızca httpOnly `gp_refresh` cookie'sinde taşınır (Path=/api/v1/auth, SameSite=Strict).
servers:
  - url: http://localhost:8080
  - url: http://localhost:3000
    description: nginx üzerinden aynı origin

paths:
  /api/v1/system/activity:
    get:
      summary: Sistem canlılığı ve simülasyon ilerlemesi (tüm giriş yapmış roller)
      description: |
        Audit içeriği/kimlikleri verilmez. Son olay ve son 30 dakikanın olay sayıları
        audit_log.occurred_at indeksinden okunur. Simülasyon bilgisi en son koşudur.
        Bağlam saati HTTP yollarında ayarlanmaz; bu uç gerçek zamanı kullanır.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Veritabanı erişilebilir
          content:
            application/json: { schema: { $ref: '#/components/schemas/SystemActivity' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503':
          description: Veritabanı erişilemiyor; DATABASE_UNAVAILABLE
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /health:
    get:
      summary: Servis ve veritabanı sağlığı
      security: []
      responses:
        "200":
          description: API ve veritabanı ayakta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, db: ok }
        "503":
          description: Veritabanına erişilemiyor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: unavailable, db: down }

  /metrics:
    get:
      summary: Prometheus metin biçiminde metrikler
      security: []
      responses:
        "200":
          description: http_requests_total, http_request_duration_seconds_sum, auth_login_total; scrape sırasında claim_tasks_open ve claim_tasks_sla_breached gauge (task_type etiketi, guvenpolice_ öneki). DB hatasında gauge örnekleri atlanır.
          content:
            text/plain: { schema: { type: string } }

  /api/v1/auth/login:
    post:
      summary: E-posta + parola ile giriş
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, description: "En fazla 72 bayt (bcrypt sınırı)" }
      responses:
        "200":
          description: Access token gövdede, refresh token Set-Cookie ile
          headers:
            Set-Cookie: { schema: { type: string }, description: "gp_refresh=...; HttpOnly; SameSite=Strict" }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Session" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: INVALID_CREDENTIALS (bilinmeyen e-posta ile aynı yanıt)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/v1/auth/refresh:
    post:
      summary: Refresh cookie ile yeni access token (tek kullanımlık rotasyon)
      description: |
        Her başarılı çağrı eski refresh token'ı iptal eder ve yenisini cookie'ye yazar.
        Daha önce kullanılmış bir token gelirse çalınma şüphesiyle kullanıcının tüm refresh token'ları iptal edilir.
      security: [{ refreshCookie: [] }]
      responses:
        "200":
          description: Yeni oturum
          content:
            application/json: { schema: { $ref: "#/components/schemas/Session" } }
        "401":
          description: INVALID_REFRESH_TOKEN
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/v1/auth/logout:
    post:
      summary: Çıkış; isteği yapanın refresh token'ını iptal eder ve cookie'yi siler
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Çıkış yapıldı }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/auth/me:
    get:
      summary: Oturumdaki kullanıcı
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Kullanıcı
          content:
            application/json: { schema: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/customers:
    get:
      summary: Müşteri listesi (keyset sayfalama)
      description: |
        Erişim: AGENT (yalnızca kendi müşterileri), UNDERWRITER (tümü). Diğer roller 403.
        TCKN maskelenmiş döner.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Sayfa
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tariffs/active:
    get:
      summary: Ürün ve tarihte geçerli tarife (valid_from <= date < valid_to, ACTIVE)
      description: Erişim AGENT, UNDERWRITER. date yoksa bugün (Türkiye saati).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product, in: query, required: true, schema: { $ref: "#/components/schemas/Product" } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Tarife sürümü, faktörler, teminat kataloğu, kısa dönem tablosu
          content:
            application/json: { schema: { $ref: "#/components/schemas/Tariff" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: NO_TARIFF, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/quotes/preview:
    post:
      summary: Primi hesaplar, kaydetmez (AGENT)
      description: |
        Tarife, `term_start` tarihine göre seçilir. Yaş müşterinin doğum tarihinden `term_start` gününe göre,
        bölge müşteri kaydından gelir. Hesap sırası: taban → AGE → NCD → REGION → VEHICLE_GROUP; her adım kuruşa
        yarımı yukarı yuvarlanır ve bir döküm satırıdır. Toplam = satırlar toplamı.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/QuoteRequest" } }
      responses:
        "200":
          description: Hesap sonucu
          content:
            application/json: { schema: { $ref: "#/components/schemas/Calculation" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: NO_TARIFF, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/quotes:
    post:
      summary: Teklifi hesaplar ve kaydeder (AGENT)
      description: Onay kuralı tetiklenirse (sürücü < 21 yaş veya prim > UW_PREMIUM_THRESHOLD_KURUS) durum UW_REVIEW, aksi halde CALCULATED. Geçerlilik 30 gün.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/QuoteRequest" } }
      responses:
        "201":
          description: Kaydedilen teklif (döküm dahil)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Quote" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: NO_TARIFF, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      summary: Teklif listesi (en yeni önce)
      description: AGENT kendi acentesininkini, CUSTOMER kendisininkini, UNDERWRITER tümünü görür.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/QuoteStatus" } }
      responses:
        "200":
          description: Sayfa (lines alanı listede yoktur)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Quote" } }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/quotes/{id}:
    get:
      summary: Teklif detayı ve döküm satırları
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Teklif
          content:
            application/json: { schema: { $ref: "#/components/schemas/Quote" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/quotes/{id}/review:
    post:
      summary: Underwriter kararı (yalnızca UW_REVIEW teklifte)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, maxLength: 1000, description: REJECT için zorunlu }
      responses:
        "200":
          description: Güncel teklif
          content:
            application/json: { schema: { $ref: "#/components/schemas/Quote" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: QUOTE_INVALID_STATE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/quotes/{id}/convert:
    post:
      summary: Teklifi poliçeye çevirir (AGENT, Idempotency-Key zorunlu)
      description: |
        Tek transaction: poliçe, sürüm 1, teminatlar, limit bakiyeleri (her teminat + yıllık toplam), taksit planı/taksitler, POLICY_ISSUE yevmiyesi, teklif CONVERTED, audit.
        Yalnızca CALCULATED/APPROVED, süresi dolmamış ve başlangıcı bugün veya sonrası olan teklif.
        Aynı anahtar + aynı istek → kayıtlı yanıt (Idempotent-Replayed: true). Aynı anahtar + farklı istek → 422.
        İşlem sürerken aynı anahtar → 409. Farklı anahtarla ikinci çevirme → 409 QUOTE_NOT_CONVERTIBLE.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                installment_count: { type: integer, minimum: 1, maximum: 12, default: 1 }
      responses:
        "201":
          description: Düzenlenen poliçe
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ["true"] }, description: Kayıtlı yanıt döndüyse }
          content:
            application/json: { schema: { $ref: "#/components/schemas/IssuedPolicy" } }
        "400": { description: IDEMPOTENCY_KEY_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "QUOTE_NOT_CONVERTIBLE, QUOTE_ALREADY_CONVERTED (benzersizlik ikinci savunma hattı) veya IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "QUOTE_EXPIRED, TERM_START_IN_PAST veya IDEMPOTENCY_KEY_REUSED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/policies:
    get:
      summary: Poliçe listesi (en yeni önce)
      description: CUSTOMER/AGENT kendi kayıtlarını; UNDERWRITER, CLAIMS_ADJUSTER, ACCOUNTING tümünü görür. APPRAISER 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Sayfa
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PolicyItem" } }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/policies/{id}:
    get:
      summary: Poliçe detayı — tüm sürümler, teminatlar, zeyiller, limit bakiyeleri, prim özeti
      description: Erişim poliçe listesiyle aynı (CUSTOMER/AGENT kendi; UNDERWRITER, CLAIMS_ADJUSTER, ACCOUNTING tümü; APPRAISER 403). Kapsam dışı → 404.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Poliçe
          content:
            application/json: { schema: { $ref: "#/components/schemas/PolicyDetail" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/policies/{id}/coverage:
    get:
      summary: Verilen tarihte geçerli sürüm ve teminatlar
      description: |
        Sürüm aralığı [effective_from, effective_to) ve poliçe sınırları birlikte uygulanır:
        tarih [start_date, end_date) içinde ve (iptal varsa) cancel_effective_date'ten önce olmalı.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: O gün geçerli sürüm
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy_id: { type: integer, format: int64 }
                  policy_no: { type: string }
                  policy_status: { type: string }
                  date: { type: string, format: date }
                  version: { $ref: "#/components/schemas/PolicyVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { description: "NOT_FOUND (poliçe yok/kapsam dışı) veya NO_COVERAGE_ON_DATE (dönem dışı ya da iptal sonrası)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/policies/{id}/endorsements/preview:
    post:
      summary: Araç değişikliği zeyli önizlemesi — kaydetmez (AGENT, UNDERWRITER)
      description: |
        Yeni yıllık prim poliçenin ORİJİNAL tarife sürümüyle (T-1 motoru) hesaplanır; yalnızca araç grubu/plaka değişir.
        Fark = (yeni − eski yıllık) × kalan gün / dönem günü, kuruşa yarımı yukarı (negatifte sıfırdan uzağa).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/VehicleChangeRequest" } }
      responses:
        "200":
          description: Hesap dökümü
          content:
            application/json: { schema: { $ref: "#/components/schemas/VehicleChangePreview" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: STALE_VERSION (base_version_no güncel değil), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "CLAIMS_AFTER_EFFECTIVE_DATE, INVALID_EFFECTIVE_DATE, POLICY_CANCELLED, POLICY_NOT_ACTIVE, NOT_A_VEHICLE_POLICY, NO_CHANGE, LIMIT_BELOW_USAGE", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/policies/{id}/endorsements:
    post:
      summary: Araç değişikliği zeyli (AGENT, UNDERWRITER; Idempotency-Key zorunlu)
      description: |
        Tek transaction, poliçe satırı FOR UPDATE: açık sürüm effective_to = zeyil tarihi ile kapanır, effective_from = zeyil
        tarihi olan yeni sürüm açılır, zeyil (endorsement_no sıradaki) ve audit yazılır. Limit değişikliği bakiyeye
        koşullu UPDATE ile yansır (used ≤ yeni limit). Zeyil tarihi açık sürümün başlangıcından sonra ve poliçe bitişinden önce olmalı.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/VehicleChangeRequest" } }
      responses:
        "201":
          description: Zeyil ve yeni sürüm
          content:
            application/json:
              schema:
                type: object
                properties:
                  cash_refund_kurus: { type: integer, format: int64 }
                  endorsement: { $ref: "#/components/schemas/Endorsement" }
                  version: { $ref: "#/components/schemas/PolicyVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "STALE_VERSION, CONCURRENT_MODIFICATION, BILLING_PLAN_MISSING, IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Önizlemeyle aynı iş hataları; IDEMPOTENCY_KEY_REUSED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/policies/{id}/cancel/preview:
    post:
      summary: İptal önizlemesi — iade tutarı ve adımlar, kaydetmez
      description: |
        CUSTOMER_REQUEST → kısa dönem (kazanılmış = yıllık × oran(geçen gün); iade = yazılmış − kazanılmış, ≥ 0).
        UNDERWRITER / NON_PAYMENT / OTHER → gün esaslı (iade = yıllık × kalan / dönem, ≤ yazılmış).
        AGENT yalnızca CUSTOMER_REQUEST verebilir (diğerleri 403); UNDERWRITER her gerekçeyi.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/CancelRequest" } }
      responses:
        "200":
          description: İade hesabı
          content:
            application/json: { schema: { $ref: "#/components/schemas/CancelPreview" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "STALE_VERSION veya BILLING_PLAN_MISSING", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "CLAIMS_AFTER_EFFECTIVE_DATE, INVALID_EFFECTIVE_DATE, POLICY_CANCELLED, POLICY_NOT_ACTIVE, SHORT_PERIOD_RATE_MISSING", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/policies/{id}/cancel:
    post:
      summary: Poliçe iptali (AGENT yalnızca CUSTOMER_REQUEST, UNDERWRITER her gerekçe; Idempotency-Key zorunlu)
      description: |
        Açık sürüm iptal tarihinde kapanır (yeni sürüm açılmaz); poliçe CANCELLED, cancel_effective_date ve cancel_reason dolar;
        iade CANCELLATION zeyline premium_delta (negatif) ve calc_detail olarak yazılır. Aynı transaction içinde taksit ayarı, ENDORSEMENT yevmiyesi ve gerekiyorsa tahsissiz nakit REFUND üretilir.
        İptal tarihi açık sürümün başlangıç günüyse (ör. başlangıçtan iptal) sürüm kapatılamaz (sıfır uzunlukta aralık
        CHECK ile yasak); teminat poliçe düzeyindeki iptal tarihiyle sona erer.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/CancelRequest" } }
      responses:
        "201":
          description: İptal zeyli ve güncel poliçe
          content:
            application/json:
              schema:
                type: object
                properties:
                  cash_refund_kurus: { type: integer, format: int64 }
                  endorsement: { $ref: "#/components/schemas/Endorsement" }
                  policy: { type: object }
